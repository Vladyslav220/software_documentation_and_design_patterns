<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати пісню</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fef2f2, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .form-card {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 8px 0;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            margin: 0 0 28px 0;
            color: #6b7280;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f2937;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            background: #f9fafb;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #dc2626;
            background: white;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #dc2626;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1 class="title">Редагувати пісню</h1>
        <p class="subtitle">Оновіть інформацію про пісню</p>

        <form method="POST">
            <div class="form-group">
                <label for="title">Назва пісні</label>
                <input type="text" id="title" name="title" value="{{ song.title }}" required>
            </div>

            <div class="form-group">
                <label for="duration">Тривалість (секунди)</label>
                <input type="number" id="duration" name="duration" value="{{ song.duration }}" required>
            </div>

            <div class="form-group">
                <label for="artist_id">Артист</label>
                <select id="artist_id" name="artist_id" required>
                    {% for artist in artists %}
                    <option value="{{ artist.id }}" {% if artist.id == song.artist_id %}selected{% endif %}>
                        {{ artist.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="playlist_id">Плейлист</label>
                <select id="playlist_id" name="playlist_id" required>
                    {% for playlist in playlists %}
                    <option value="{{ playlist.id }}" {% if playlist.id == song.playlist_id %}selected{% endif %}>
                        {{ playlist.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Оновити</button>
                <a href="/" class="btn btn-secondary">Назад</a>
            </div>
        </form>
    </div>
</body>
</html>
