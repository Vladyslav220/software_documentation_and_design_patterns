<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати користувача</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfeff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 8px 0;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            margin: 0 0 28px 0;
            color: #6b7280;
            font-size: 15px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f2937;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
        }

        input:focus, select:focus {
            border-color: #0ea5e9;
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #0891b2;
            color: white;
        }

        .btn-primary:hover {
            background: #0e7490;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1 class="title">Редагувати користувача</h1>
        <p class="subtitle">Оновіть дані користувача у формі нижче</p>

        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="text" id="password" name="password" value="{{ user.password }}" required>
            </div>

            <div class="form-group">
                <label for="subscription_type">Тип підписки</label>
                <select id="subscription_type" name="subscription_type" required>
                    <option value="Free" {% if user.subscription_type == 'Free' %}selected{% endif %}>Free</option>
                    <option value="Premium" {% if user.subscription_type == 'Premium' %}selected{% endif %}>Premium</option>
                    <option value="Family" {% if user.subscription_type == 'Family' %}selected{% endif %}>Family</option>
                    <option value="Student" {% if user.subscription_type == 'Student' %}selected{% endif %}>Student</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Оновити</button>
                <a href="/" class="btn btn-secondary">Назад</a>
            </div>
        </form>
    </div>
</body>
</html>
