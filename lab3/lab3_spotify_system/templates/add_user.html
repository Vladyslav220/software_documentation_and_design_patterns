<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати користувача</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 8px 0;
            font-size: 32px;
            color: #111827;
        }

        .subtitle {
            margin: 0 0 28px 0;
            color: #6b7280;
            font-size: 15px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f2937;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f9fafb;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h1 class="title">Додати користувача</h1>
        <p class="subtitle">Заповніть форму для створення нового користувача</p>

        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="text" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="subscription_type">Тип підписки</label>
                <select id="subscription_type" name="subscription_type" required>
                    <option value="Free">Free</option>
                    <option value="Premium">Premium</option>
                    <option value="Family">Family</option>
                    <option value="Student">Student</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Зберегти</button>
                <a href="/" class="btn btn-secondary">Назад</a>
            </div>
        </form>
    </div>
</body>
</html>
